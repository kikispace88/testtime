async function start(tids,label){app.innerHTML=LOAD;const{data}=await sb.from('questions').select('*').in('source',['paper','custom','generated']).in('topic_id',tids).limit(300);
 const pq=sh(data||[]).map(q=>({src:'paper',q})),gens=tids.flatMap(t=>GEN[t]||[]),gq=gens.length?Array.from({length:10},(_,i)=>({src:'gen',g:mk(gens[i%gens.length])})):[];
 let qs;if(pq.length&&gq.length){const a=Math.min(pq.length,5);qs=[...pq.slice(0,a),...gq.slice(0,10-a)]}else qs=(pq.length?pq:gq).slice(0,10);
 if(!qs.length)return noQ();await sign(qs);S.run={label,qs:sh(qs),i:0,score:0,saves:[],again:()=>start(tids,label)};ask()}
async function startPaper(p){app.innerHTML=LOAD;const{data}=await sb.from('questions').select('*').eq('paper_id',p.id);
 const qs=(data||[]).sort((a,b)=>String(a.number).localeCompare(String(b.number),undefined,{numeric:true})).map(q=>({src:'paper',q}));
 if(!qs.length)return noQ();await sign(qs);S.run={label:p.title,qs,i:0,score:0,saves:[]};ask()}
const TY=x=>x.src==='gen'?(x.g.t==='eq'?'equation':'mcq'):x.q.qtype;
const AN=x=>x.src==='gen'?(x.g.t==='eq'?{nums:x.g.nums,op:x.g.op,res:x.g.res}:x.g.a):x.q.answer;
function ask(){const r=S.run,x=r.qs[r.i];r.done=false;r.shown=false;r.sel=TY(x)==='mcq'||TY(x)==='truefalse'?null:'';r.eq=['','',''];r.bl=[];
 app.innerHTML=`<div class="bar"><i style="width:${r.i/r.qs.length*100}%"></i></div>
<div class="top"><button class="x" onclick="home()" aria-label="Quit">✕</button><span>${esc(r.label)}</span><span>${r.i+1} of ${r.qs.length}</span></div>
${x.src==='gen'?`<h2>${x.g.q}</h2><div class="vis">${x.g.pic||''}</div>`:`${img(x.q.passage_image_path)}${ptxt(x.q)}${img(x.q.image_path)}`}
<div id="in"></div><div id="fb" aria-live="polite"></div><button id="go" class="primary" disabled onclick="go()">${TY(x)==='open'?'Show answer':'Check'}</button>`;draw()}
function draw(){const r=S.run,x=r.qs[r.i],t=TY(x),a=AN(x),d=$('#in');
 if(t==='mcq'){const g=x.src==='gen',ot=!g&&Array.isArray(x.q.options)&&x.q.options.length?x.q.options:null,lst=g||ot,c=g?a:a-1,o=g?x.g.o:(ot||['1','2','3','4']);d.innerHTML=(lst?'':'<div class="tiles">')+o.map((s,k)=>`<button class="opt ${r.done?(k===c?'good':k===r.sel?'bad':''):(r.sel===k?'on':'')}" ${r.done?'disabled':''} onclick="S.run.sel=${k};draw()">${lst?`<i>${k+1}</i>${g?s:esc(s)}`:s}</button>`).join('')+(lst?'':'</div>')}
 else if(t==='truefalse')d.innerHTML='<div class="tiles">'+[true,false].map(v=>`<button class="opt ${r.done?(v===a?'good':v===r.sel?'bad':''):(r.sel===v?'on':'')}" ${r.done?'disabled':''} onclick="S.run.sel=${v};draw()">${v?'True':'False'}</button>`).join('')+'</div>';
 else if(t==='equation')d.innerHTML=`<div class="eqrow"><input inputmode="numeric" aria-label="first number" oninput="S.run.eq[0]=this.value;rd()">${a.op}<input inputmode="numeric" aria-label="second number" oninput="S.run.eq[1]=this.value;rd()">=<input inputmode="numeric" aria-label="answer" oninput="S.run.eq[2]=this.value;rd()"></div>`+(x.src==='gen'?`<p class="tail">${x.g.tail}</p>`:'');
 else if(t==='multiblank')d.innerHTML=a.map((_,i)=>`<input style="margin:6px 0" placeholder="Blank ${i+1}" aria-label="Blank ${i+1}" oninput="S.run.bl[${i}]=this.value;rd()">`).join('');
 else if(t==='open')d.innerHTML='';
 else d.innerHTML=`<input ${t==='number'?'inputmode="numeric"':'autocapitalize="none" autocomplete="off"'} aria-label="your answer" oninput="S.run.sel=this.value;rd()">`;
 rd()}
const nz=s=>String(s??'').trim().toLowerCase(),same=(a,b)=>nz(a)===nz(b)||(nz(a)!==''&&!isNaN(a)&&!isNaN(b)&&Number(a)===Number(b));
function ready(x){const r=S.run,t=TY(x);return t==='open'||(t==='mcq'||t==='truefalse'?r.sel!==null:t==='equation'?r.eq.every(v=>v.trim()!==''):t==='multiblank'?AN(x).every((_,i)=>nz(r.bl[i])!==''):nz(r.sel)!=='')}
const rd=()=>{const r=S.run,x=r.qs[r.i],b=$('#go');if(b)b.disabled=r.done?false:!ready(x)};
function check(x){const r=S.run,t=TY(x),a=AN(x);
 if(t==='mcq')return r.sel===(x.src==='gen'?a:a-1);if(t==='truefalse')return r.sel===a;
 if(t==='number')return nz(r.sel)!==''&&Number(r.sel)===Number(a);if(t==='text')return same(r.sel,a);
 if(t==='multiblank')return a.every((v,i)=>same(r.bl[i],v));
 if(t==='equation'){const[p,q,s]=r.eq.map(Number);if(s!==a.res)return false;return'+×x*'.includes(a.op)?((p===a.nums[0]&&q===a.nums[1])||(p===a.nums[1]&&q===a.nums[0])):(p===a.nums[0]&&q===a.nums[1])}
 return false}
function show(x){const t=TY(x),a=AN(x);return t==='mcq'?(x.src==='gen'?x.g.o[a]:(Array.isArray(x.q.options)&&x.q.options.length?x.q.options[a-1]:'option '+a)):t==='truefalse'?(a?'True':'False'):t==='multiblank'?a.join(', '):t==='equation'?`${a.nums[0]} ${a.op} ${a.nums[1]} = ${a.res}`:String(a)}
function record(x,ok){const r=S.run;r.saves.push(sb.from('attempts').insert({child_id:S.kid.id,question_id:x.src==='paper'?x.q.id:null,template_id:x.src==='gen'?x.g.id:null,topic_id:x.src==='gen'?TOPIC[x.g.id]:x.q.topic_id,correct:ok,response:{sel:r.sel,eq:r.eq,bl:r.bl}}).then(z=>z.error?1:0,()=>1))}
function go(){const r=S.run,x=r.qs[r.i],t=TY(x),fb=$('#fb'),b=$('#go');
 if(t==='open'&&!r.shown){r.shown=true;const q=x.q;fb.className='';fb.innerHTML=`${img(q.answer_image_path)}${typeof q.answer==='string'&&q.answer?`<p>Answer: <b>${esc(q.answer)}</b></p>`:''}<p>Did you get it right?</p>`;b.style.display='none';
  fb.insertAdjacentHTML('afterend','<div id="sm"><button class="primary" onclick="selfMark(1)">✅ I got it right</button><button class="mini" style="margin-top:10px" onclick="selfMark(0)">Not yet</button></div>');return}
 if(!r.done){r.done=true;const ok=check(x);record(x,ok);if(ok)r.score++;fb.className=ok?'ok':'no';
  fb.innerHTML=ok?'🎉 Correct! Well done!':`Not quite. The answer is <b>${esc(show(x))}</b>${x.src==='paper'?img(x.q.answer_image_path):''}`;
  if(t==='mcq'||t==='truefalse')draw();else $('#in').classList.add('lock');
  b.textContent=r.i===r.qs.length-1?'See my score':'Next question';b.disabled=false}else next()}
function selfMark(ok){const r=S.run;record(r.qs[r.i],!!ok);if(ok)r.score++;next()}
function next(){const r=S.run;r.i<r.qs.length-1?(r.i++,ask()):finish()}
async function finish(){const r=S.run;app.innerHTML=LOAD;const bad=(await Promise.all(r.saves)).reduce((a,b)=>a+b,0),pc=r.score/r.qs.length;
 app.innerHTML=`<div class="score">${r.score} / ${r.qs.length}</div><div class="stars">${pc>=.9?'⭐⭐⭐':pc>=.6?'⭐⭐':'⭐'}</div>
<h2 style="text-align:center">${pc===1?'Perfect score!':pc>=.6?'Great job!':'Good try! Let’s practise again.'}</h2>
${bad?'<p class="err" style="text-align:center">Some answers could not be saved. Check your internet.</p>':''}
${r.again?'<button class="primary" id="again">Practise again</button>':''}<button class="mini" onclick="home()" style="margin-top:14px">Back to home</button>`;
 if(r.again)$('#again').onclick=r.again}
async function out(){await sb.auth.signOut();localStorage.removeItem('kid');login()}
boot();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
